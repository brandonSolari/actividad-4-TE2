{% extends "base.html" %}
{% block titulo %}{{ 'Editar categoría' if categoria else 'Nueva categoría' }}{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h2 class="h4 mb-3">{{ 'Editar categoría' if categoria else 'Nueva categoría' }}</h2>
        <form method="post">
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" name="nombre" maxlength="100"
                   value="{{ request.form.get('nombre', categoria.nombre if categoria else '') }}" required>
          </div>
          <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción</label>
            <input type="text" class="form-control" id="descripcion" name="descripcion" maxlength="255"
                   value="{{ request.form.get('descripcion', (categoria.descripcion or '') if categoria else '') }}">
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a class="btn btn-outline-secondary" href="{{ url_for('categorias.lista') }}">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
